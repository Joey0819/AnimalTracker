# DenseTrack-AI: Mac-native zero-click adaptive bidirectional tracking
# Black laboratory animals on a light background with a fixed top-view camera.

species: mouse
n_animals: 4

detection:
  backend: dark_object
  detection_prompt: top-view black laboratory mouse
  min_mask_area: 400
  max_mask_area: 25000

sam2:
  enabled: false

pose:
  backend: geometry
  fallback_to_geometry: true

tracklet:
  backend: mac_adaptive
  fixed_max_assignment_distance: 150
  fixed_prediction_confidence: 0.55
  adaptive_appearance_weight: 0.35
  adaptive_template_momentum: 0.12
  adaptive_template_update_cost: 0.72
  adaptive_template_min_margin: 0.08
  adaptive_template_min_confidence: 0.55
  adaptive_template_bank_size: 8
  adaptive_init_window: 120
  adaptive_consistency_distance: 90
  adaptive_identity_smoothing: true
  adaptive_smoothing_motion_weight: 0.70
  adaptive_smoothing_evidence_weight: 0.55
  adaptive_smoothing_appearance_weight: 0.20
  adaptive_discrete_geometry: true
  adaptive_geometry_weight: 0.30
  adaptive_geometry_coarse_bins: 8
  adaptive_geometry_fine_bins: 8
  adaptive_geometry_knn: 5
  adaptive_velocity_window: 7
  adaptive_reacquisition_min_margin: 0.035
  adaptive_smoothing_geometry_weight: 0.50
  adaptive_smoothing_max_states: 128

reid:
  enabled: false

representation:
  enabled: true
  dim: 8
  window_frames: 15
  sample_every: 3
  camera_manifest: null

bioacoustic_ssl:
  enabled: false
  audio_path: null
  species: dolphin

experiment:
  enabled: true
  template_id: open_field
  time_bin_s: 60.0

global_optimizer:
  method: long_term
  max_temporal_gap: 250
  min_link_confidence: 0.2
  long_term_geometry_weight: 0.25
  long_term_velocity_window: 7
  long_term_coarse_bins: 8
  long_term_fine_bins: 8
  closed_set_stitching: true

export:
  formats:
    - mot
    - coco
    - csv
    - sleap
  min_confidence: 0.0
  overlay_video: true
  overlay_fps: null

processing_resolution: 0
device: auto
